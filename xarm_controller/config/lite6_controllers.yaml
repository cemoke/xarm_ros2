controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lite6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle
      
    end_effector_controller:
      type: end_effector_controller/EndEffectorControl

    cartesian_compliance_controller:
      type: cartesian_compliance_controller/CartesianComplianceController

lite6_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 1.0, goal: 0.01}
      joint2: {trajectory: 1.0, goal: 0.01}
      joint3: {trajectory: 1.0, goal: 0.01}
      joint4: {trajectory: 1.0, goal: 0.01}
      joint5: {trajectory: 1.0, goal: 0.01}
      joint6: {trajectory: 1.0, goal: 0.01}
    interface_name: position
    state_publish_rate: 25.0
    action_monitor_rate: 10.0

cartesian_motion_controller:
  ros__parameters:

    # See the cartesian_compliance_controller
    end_effector_link: "probe"
    robot_base_link: "link_base"
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # See the cartesian_compliance_controller
    command_interfaces:
      - position
      # - velocity

    solver:
        error_scale: 1.0
        iterations: 10
        publish_state_feedback: True

    pd_gains:
        trans_x: {p: 10.0}
        trans_y: {p: 10.0}
        trans_z: {p: 10.0}
        rot_x: {p: 1.0}
        rot_y: {p: 1.0}
        rot_z: {p: 10.0}

motion_control_handle:
  ros__parameters:
    end_effector_link: "probe"
    robot_base_link: "link_base"
    ft_sensor_ref_link: "ft_sensor0_wrench"
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      
end_effector_controller:
  ros__parameters:
    end_effector_link: "probe"
    robot_base_link: "link_base"
    ft_sensor_ref_link: "ft_sensor0_wrench"
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

cartesian_compliance_controller:
  ros__parameters:
    end_effector_link: "probe"
    robot_base_link: "link_base"
    ft_sensor_ref_link: "ft_sensor0_wrench"
    compliance_ref_link: "probe"

    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # Choose between position or velocity.  In fact, the controllers allow to
    # set both at the same time, but not all drivers will support this.
    # In general, position control is a little smoother due to the double
    # time-integrated commands from the solver. If available on a robot, it
    # should be the default.  On some drivers, the velocity interface provides
    # faster control cycles, and hence could improve stability in
    # contact-dominated tasks.  A drawback is that we lose one time integration
    # step here and obtain noisier command signals in comparison to the
    # position interface.  It's probably suitable to test both on a new robot
    # and decide for what works best.
    command_interfaces:
      - position
      # - velocity

    stiffness:  # w.r.t. compliance_ref_link coordinates
        trans_x: 1000.0
        trans_y: 600.0
        trans_z: 800.0
        rot_x: 5.0
        rot_y: 20.0
        rot_z: 5.0

    solver:
        error_scale: 0.5
        iterations: 1
        publish_state_feedback: True

    # For all controllers, these gains are w.r.t. the robot_base_link coordinates.
    pd_gains:
        trans_x: {p: 2.0, d: 0.008}
        trans_y: {p: 2.0, d: 0.008}
        trans_z: {p: 2.0, d: 0.008}
        rot_x: {p: 2.0, d: 0.005}
        rot_y: {p: 2.0, d: 0.005}
        rot_z: {p: 1.0, d: 0.005}